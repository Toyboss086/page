<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Une page secrète</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #050505; 
            margin: 0;
            padding: 0;
        }

        /* --- ÉCRAN DE VERROUILLAGE --- */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Special Elite', monospace;
            padding: 20px;
            box-sizing: border-box;
        }

        #lock-screen h2 {
            color: rgb(130, 20, 20);
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-align: center;
        }

        #password-input {
            background: #111;
            border: 1px solid rgba(130, 20, 20, 0.5);
            color: #fff;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 4px;
            text-align: center;
            outline: none;
            width: 100%;
            max-width: 250px;
            margin-bottom: 15px;
            font-family: 'Special Elite', monospace;
        }

        #password-input:focus {
            border-color: rgb(210, 20, 20);
            box-shadow: 0 0 8px rgba(210, 20, 20, 0.3);
        }

        #submit-btn {
            background: rgb(110, 15, 15);
            color: #fff;
            border: none;
            padding: 10px 25px;
            font-family: 'Special Elite', monospace;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
        }

        #submit-btn:hover {
            background: rgb(160, 20, 20);
        }

        #error-msg {
            color: rgb(210, 20, 20);
            font-size: 0.9rem;
            margin-top: 15px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h2>Cette page est privée.<br>Entre le mot de passe pour continuer.</h2>
        <input type="password" id="password-input" placeholder="Mot de passe...">
        <button id="submit-btn">Ouvrir</button>
        <div id="error-msg"></div>
    </div>

    <script>
    // --- SCRIPT DU MOT DE PASSE ---
    const correctPassword = "01001101 01011001 01101100 01101001 01110100 01101100 01001100 01100101 01010011 01110100 01100001 52
        "; // CHANGE TON MOT DE PASSE ICI

    const passwordInput = document.getElementById('password-input');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    function checkPassword() {
        if (passwordInput.value === correctPassword) {
            // Redirection vers secret.html si le mot de passe est bon
            window.location.href = "letter.html";
        } else {
            errorMsg.style.color = "rgb(210, 20, 20)";
            errorMsg.textContent = "Mot de passe incorrect...";
            passwordInput.value = "";
        }
    }

    submitBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkPassword();
    });
    </script>
</body>
</html>
